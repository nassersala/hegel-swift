name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # arm64 runner: the vendored CHegel.xcframework carries macos-arm64,
    # ios-arm64, and ios-arm64-simulator slices.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # HegelTesting uses Swift Testing's IssueHandlingTrait (Swift 6.2+).
          xcode-version: latest-stable
      - name: Versions
        run: swift --version && xcodebuild -version
      - name: Test Hegel
        # libhegel detects CI (GITHUB_ACTIONS): the example database is
        # auto-disabled and runs derandomize by default. Hasher is seeded
        # per process; Laws.hashable's Set-counts law depends on it.
        env:
          SWIFT_DETERMINISTIC_HASHING: 1
        run: swift test
      - name: Test example (AdhanProperties)
        run: swift test --package-path Examples/AdhanProperties
      - name: Test example (AffordanceProperties)
        run: swift test --package-path Examples/AffordanceProperties
      - name: Test example (RegexProperties)
        run: swift test --package-path Examples/RegexProperties
      - name: Test example (SecurityProperties)
        run: swift test --package-path Examples/SecurityProperties
      - name: Test example (ComplexProperties)
        run: swift test --package-path Examples/ComplexProperties
      - name: Test example (AgentProperties)
        run: swift test --package-path Examples/AgentProperties
      - name: Test example (AsyncProperties)
        run: swift test --package-path Examples/AsyncProperties
      - name: Test example (ScheduleProperties)
        run: swift test --package-path Examples/ScheduleProperties
      - name: Test example (DequeProperties)
        run: swift test --package-path Examples/DequeProperties
      - name: Test example (Quicksort)
        run: swift test --package-path Examples/Quicksort
      - name: Test example (AboveTheCode)
        run: swift test --package-path Examples/AboveTheCode
      - name: Test example (BankSystem)
        run: swift test --package-path Examples/BankSystem
      - name: Test example (BankControl)
        run: swift test --package-path Examples/BankControl
      - name: Test example (TwoPhaseCommit)
        run: swift test --package-path Examples/TwoPhaseCommit
      - name: Test example (AgdaVerifiedModel)
        run: swift test --package-path Examples/AgdaVerifiedModel
      - name: Install Lean (elan)
        run: curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain stable --no-modify-path
      - name: Build the Lean model (proofs + C)
        run: cd Examples/LeanVerifiedModel/Lean && $HOME/.elan/bin/lake build Otp:static Bank:static
      - name: Test example (LeanVerifiedModel)
        run: swift test --package-path Examples/LeanVerifiedModel
      - name: Test AffordanceProperties on iOS simulator
        working-directory: Examples/AffordanceProperties
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | xargs)
          echo "using simulator: $DEVICE"
          xcodebuild test -scheme AffordanceProperties-Package \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath .build/dd-sim
      - name: Build for iOS simulator
        run: >
          xcodebuild build -scheme HegelTesting
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/dd-ios-sim

  conformance:
    # Differential conformance vs hegel-go: same seed, same engine binary,
    # transcripts must match byte for byte.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Compare draw transcripts with hegel-go
        run: Scripts/conformance.sh

  foundation-6-4:
    # swift-foundation#2198 (URL.standardized on a relative file URL drops
    # the base) is fixed by #1942 on release/6.4.x. On Linux swift-foundation
    # is Foundation, so this checks the fix before macOS 27 ships it. The
    # SecurityProperties test pins the bug where present and passes where
    # absent; this job checks the "absent" side is real.
    runs-on: ubuntu-latest
    container: swiftlang/swift:nightly-6.4.x-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: swift --version
      - name: URL.standardized on a relative file URL keeps the base
        run: swift Scripts/check-url-standardized.swift
